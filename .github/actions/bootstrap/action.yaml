name: "Bootstrap"

description: "Bootstrap node + go-make tooling and install npm dependencies"

inputs:
  install-deps:
    description: "Run npm ci to install node dependencies"
    default: "true"

runs:
  using: "composite"
  steps:
    # setup go, go-make, binny, and cache go modules (this is also what
    # restricts cache writes to the default branch, per audit guidance)
    - uses: anchore/go-make/.github/actions/setup@87a55e98f4e5e52a67d2cc5a3a0365070a380f65 # v0.9.4
      with:
        cache-dependency-path: .make/go.sum

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: npm

    - name: Install npm dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: npm ci
